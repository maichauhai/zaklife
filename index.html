<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>ZakLife v2</title>
<meta name="description" content="ZakLife personal command center">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=20260613-health">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark">Z</div>
      <div>
        <div class="brand-name">ZakLife</div>
        <div class="brand-sub">Command Center</div>
      </div>
    </div>

    <nav class="nav-group">
      <button class="nav-item active" data-route="dashboard">
        <span class="nav-icon">▦</span><span class="nav-label">Dashboard</span>
      </button>
      <div class="nav-section">Monstea</div>
      <button class="nav-item" data-route="pos">
        <span class="nav-icon">☕</span><span class="nav-label">POS từ xa</span>
      </button>
      <button class="nav-item" data-route="content">
        <span class="nav-icon">▣</span><span class="nav-label">Content</span>
      </button>
      <div class="nav-section">Cá nhân</div>
      <button class="nav-item" data-route="tasks">
        <span class="nav-icon">☑</span><span class="nav-label">Tasks</span>
      </button>
      <button class="nav-item" data-route="journal">
        <span class="nav-icon">◷</span><span class="nav-label">Journal & Habits</span>
      </button>
      <button class="nav-item" data-route="health">
        <span class="nav-icon">⚡</span><span class="nav-label">Health Tracker</span>
      </button>
      <button class="nav-item" data-route="ideas">
        <span class="nav-icon">✦</span><span class="nav-label">Ideas</span>
      </button>
      <button class="nav-item" data-route="vault">
        <span class="nav-icon">◆</span><span class="nav-label">Vault</span>
      </button>
      <button class="nav-item" data-route="quickdock">
        <span class="nav-icon">⌘</span><span class="nav-label">Quick Dock</span>
      </button>
      <div class="nav-section">Kinh doanh</div>
      <button class="nav-item" data-route="crm">
        <span class="nav-icon">▦</span><span class="nav-label">CRM</span>
      </button>
      <div class="nav-section">He thong</div>
      <button class="nav-item" data-route="settings">
        <span class="nav-icon">⚙</span><span class="nav-label">Settings</span>
      </button>
    </nav>

    <div class="sidebar-footer">
      <div class="sync-pill" id="syncStatus"><span class="dot muted"></span>Offline</div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button class="icon-btn mobile-menu" id="menuToggle" aria-label="Menu">☰</button>
      <div>
        <h1 id="pageTitle">Dashboard</h1>
        <p id="pageSubtitle">Tổng quan hôm nay</p>
      </div>
      <div class="topbar-actions">
        <div class="date-chip" id="currentDate">--</div>
        <div class="user-chip">
          <img src="assets/avatar.png" alt="">
          <span>Zak</span>
        </div>
      </div>
    </header>

    <section class="view active" id="view-dashboard" data-title="Dashboard" data-subtitle="Tổng quan hôm nay">
      <div id="dashboardRoot"></div>
    </section>

    <section class="view" id="view-pos" data-title="Monstea POS" data-subtitle="Theo dõi quán từ xa">
      <div id="posRoot"></div>
    </section>

    <section class="view" id="view-content" data-title="Content Manager" data-subtitle="Lịch bài fanpage">
      <div id="contentRoot"></div>
    </section>

    <section class="view" id="view-tasks" data-title="Tasks" data-subtitle="Kanban công việc">
      <div id="tasksRoot"></div>
    </section>

    <section class="view" id="view-journal" data-title="Journal & Habits" data-subtitle="Nhật ký và thói quen">
      <div id="journalRoot"></div>
    </section>

    <section class="view" id="view-health" data-title="Health Tracker" data-subtitle="Số đo body, ảnh tiến trình và PR gym">
      <div id="healthRoot"></div>
    </section>

    <section class="view" id="view-ideas" data-title="Ideas" data-subtitle="Inbox ý tưởng">
      <div id="ideasRoot"></div>
    </section>

    <section class="view" id="view-vault" data-title="Vault" data-subtitle="Dữ liệu riêng">
      <div id="vaultRoot"></div>
    </section>

    <section class="view" id="view-quickdock" data-title="Quick Dock" data-subtitle="Link, lệnh và ghi chú nhanh">
      <div id="quickdockRoot"></div>
    </section>

    <section class="view" id="view-crm" data-title="CRM Leads" data-subtitle="Quan ly lead, deal, du an">
      <div id="crmRoot"></div>
    </section>

    <section class="view" id="view-settings" data-title="Settings" data-subtitle="Cấu hình">
      <div id="settingsRoot"></div>
    </section>
  </main>
</div>

<div class="toast-wrap" id="toastWrap"></div>

<script src="js/firebase-init.js?v=20260613-task-cleanup"></script>
<script src="js/supabase-init.js?v=20260613-task-cleanup"></script>
<script src="js/dashboard.js?v=20260613-task-cleanup"></script>
<script src="js/monstea-pos.js?v=20260613-task-cleanup"></script>
<script src="js/content.js?v=20260613-task-cleanup"></script>
<script src="js/tasks.js?v=20260613-task-cleanup"></script>
<script src="js/journal.js?v=20260613-task-cleanup"></script>
<script src="js/health.js?v=20260613-health"></script>
<script src="js/ideas.js?v=20260613-task-cleanup"></script>
<script src="js/vault.js?v=20260613-task-cleanup"></script>
<script src="js/quickdock.js?v=20260613-task-cleanup"></script>
<script src="js/crm.js?v=20260613-task-cleanup"></script>
<script src="js/settings.js?v=20260613-task-cleanup"></script>
<script src="js/app.js?v=20260613-health"></script>
</body>
</html>
