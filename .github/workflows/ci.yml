name: ZakLife CI

on:
  push:
    branches:
      - main
      - staging
  pull_request:

permissions:
  contents: read

jobs:
  static-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find js workers -type f -name "*.js" -print0 | xargs -0 -n1 node --check

      - name: Check Python syntax
        shell: bash
        run: |
          set -euo pipefail
          if [ -d ops ]; then
            find ops -type f -name "*.py" -print0 | xargs -0 -n1 python -m py_compile
          fi

      - name: Check required static files
        shell: bash
        run: |
          test -f index.html
          test -f style.css
          test -d js
